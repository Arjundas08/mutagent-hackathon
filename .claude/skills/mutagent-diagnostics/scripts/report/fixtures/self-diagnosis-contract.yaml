schema_version: "0.1.0"
skill:
  name: "sample-skill"
  version: "0.1.0"
  class: "tool-skill"
success_criteria:
  - category: operational
    notes: "install / invoke / runtime detection / exit codes"
    criteria:
      - id: "op-1-exits-cleanly"
        statement: "Skill exits with code 0 on successful run"
        evidence_source: "cmd-output"
  - category: onboarding
    notes: "first-invocation routing / platform detect / config persist"
    criteria:
      - id: "ob-1-platform-detect"
        statement: "Platform auto-detection succeeds on first invoke"
        evidence_source: "trace"
  - category: behavioral
    notes: "agent dispatch + return + cap-of-5 + orphan check"
    criteria:
      - id: "bh-1-dispatch-returns"
        statement: "All dispatched sub-agents return before skill exits"
        evidence_source: "trace"
  - category: hitl
    notes: "AskUserQuestion fires + clipboard handoff + chat-fallback works"
    criteria:
      - id: "hi-1-ask-fires"
        statement: "AskUserQuestion fires at decision gates"
        evidence_source: "trace"
  - category: output
    notes: "output artifacts conform to declared schema"
    criteria:
      - id: "os-1-schema-valid"
        statement: "Output artifacts conform to declared schema"
        evidence_source: "file:line"
  - category: methodology
    notes: "Step 0 census + assumptions + evidence-grounded findings + recursive whys"
    criteria:
      - id: "me-1-step0-census"
        statement: "Step 0 signal census runs before analysis"
        evidence_source: "trace"
  - category: tier-performance
    notes: "Tier 0 scan before LLM + budgets + relative thresholds"
    criteria:
      - id: "tp-1-tier0-before-llm"
        statement: "Tier-0 static scan runs before any LLM call"
        evidence_source: "trace"
  - category: source-platform
    notes: "if skill ingests sources: each source primitive normalizes correctly"
    criteria:
      - id: "sp-1-normalizes"
        statement: "Source platform traces normalize without error"
        evidence_source: "trace"
  - category: target-platform
    notes: "if skill applies changes: each target adapter behaves per contract"
    criteria:
      - id: "tg-1-adapter"
        statement: "Target adapter applies changes per contract"
        evidence_source: "trace"
  - category: maintenance
    notes: "doctor.ts + audit emit + version pinned + frontmatter intact"
    criteria:
      - id: "mt-1-doctor"
        statement: "doctor.ts probes pass without errors"
        evidence_source: "cmd-output"
scenarios:
  - id: "s1-happy-path"
    trigger:
      type: "cli"
      payload: "bun scripts/cli/run.sh scripts/report/render.ts --help"
    expected: "Usage message printed"
    acceptance_gate:
      gate_type: "command-exit"
      gate_spec: "exit 0"
trajectory_log_format:
  schema:
    invocation_id: "string (uuid v4)"
    captured_at: "string (ISO8601)"
    scenario_id: "string"
    trace_refs: "object"
    diagnostics_ingestable: "boolean"
    summary: "string"
    findings_count_by_audience: "object"
  default_landing_path: "trajectory-log.yaml"
evidence_landing_paths:
  test_report_yaml: "test-report.yaml"
  trajectory_log_append_to: "trajectory-log.yaml"
  llm_judge_results_dir: "llm-judge-evals/"
